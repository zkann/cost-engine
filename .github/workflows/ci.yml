name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up environment
        run: uv venv --python 3.12
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest -q

  audit:
    # Catch a vulnerable dependency before a downstream service pins this package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up environment
        run: uv venv --python 3.12
      - name: Install with all extras
        run: uv pip install -e ".[aws,llm]" pip-audit
      - name: Dependency audit
        # Skip the local cost-engine package (editable, not on PyPI). Third-party
        # deps are still audited and a real advisory fails the job. (--strict is
        # omitted because it would treat the skipped local package as an error.)
        run: uv run pip-audit --skip-editable

  secret-scan:
    # Backstop against a secret ever landing in this public repo or its history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
