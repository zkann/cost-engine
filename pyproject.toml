[project]
name = "cost-engine"
version = "0.1.0"
description = "FinOps cost analysis engine: ingest AWS Cost & Usage Report data, find savings opportunities, and generate dollar-quantified reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zak Kann", email = "zak@zakkann.com" }]
keywords = ["finops", "aws", "cost-optimization", "cur", "cloud"]

dependencies = [
    "polars>=1.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Real AWS connectors (Phase 2). Kept optional so the synthetic demo runs with zero cloud deps.
aws = ["boto3>=1.34"]
# LLM-generated executive summary. Optional: a deterministic fallback runs without it.
llm = ["anthropic>=0.39"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
cost-engine = "cost_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...) in argument defaults is the idiomatic Typer pattern.
"src/cost_engine/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
